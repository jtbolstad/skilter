name: Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm app:build

      # Kopi med fast navn, så README kan lenke til releases/latest/download/Skilter-x64-setup.exe
      - name: Installer med fast navn
        shell: bash
        run: cp src-tauri/target/release/bundle/nsis/Skilter_*_x64-setup.exe src-tauri/target/release/bundle/nsis/Skilter-x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: skilter-installer
          path: src-tauri/target/release/bundle/nsis/Skilter_*_x64-setup.exe

      - name: Legg installer på GitHub-release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          body: |
            **Windows:** last ned `Skilter-x64-setup.exe` og kjør den. Installeren er ikke signert, så
            Windows SmartScreen kan vise «Ukjent utgiver» – trykk **Mer info** og **Kjør likevel**.
